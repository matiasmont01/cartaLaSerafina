<!DOCTYPE html>
<html>
<head>
    <title>Color Extractor</title>
</head>
<body>
    <div id="results">Running color analysis...</div>
    <script>
        const images = [
            'media__1786632762892.png',
            'media__1786632762901.png',
            'media__1786632762910.png',
            'media__1786632762924.png'
        ];

        const resultsDiv = document.getElementById('results');

        function analyzeImage(filename) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = 'assets/' + filename;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;

                    // Scan for green pixels: G is high, R and B are low
                    let greenPixels = [];
                    for (let y = 0; y < canvas.height; y++) {
                        for (let x = 0; x < canvas.width; x++) {
                            const idx = (y * canvas.width + x) * 4;
                            const r = data[idx];
                            const g = data[idx+1];
                            const b = data[idx+2];

                            // Green arrow: high green, low red, low blue (bright green)
                            if (g > 150 && r < 100 && b < 100) {
                                greenPixels.push({x, y, r, g, b});
                            }
                        }
                    }

                    if (greenPixels.length > 0) {
                        // Find clusters or bounding box
                        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                        greenPixels.forEach(p => {
                            if (p.x < minX) minX = p.x;
                            if (p.x > maxX) maxX = p.x;
                            if (p.y < minY) minY = p.y;
                            if (p.y > maxY) maxY = p.y;
                        });

                        // Sample non-green pixels near the green pixels to find the menu colors
                        // Let's get colors surrounding this green cluster
                        let colors = {};
                        for (let y = Math.max(0, minY - 10); y <= Math.min(canvas.height - 1, maxY + 10); y++) {
                            for (let x = Math.max(0, minX - 10); x <= Math.min(canvas.width - 1, maxX + 10); x++) {
                                const idx = (y * canvas.width + x) * 4;
                                const r = data[idx];
                                const g = data[idx+1];
                                const b = data[idx+2];
                                // If not green
                                if (!(g > 120 && r < 120 && b < 120)) {
                                    const key = `${r},${g},${b}`;
                                    colors[key] = (colors[key] || 0) + 1;
                                }
                            }
                        }

                        // Get top 3 colors
                        const topColors = Object.entries(colors)
                            .sort((a,b) => b[1] - a[1])
                            .slice(0, 5)
                            .map(([rgbStr, count]) => {
                                const [r,g,b] = rgbStr.split(',').map(Number);
                                const hex = "#" + [r,g,b].map(x => x.toString(16).padStart(2, '0')).join('');
                                return {hex, rgb: `rgb(${r},${g},${b})`, count};
                            });

                        resolve({
                            filename,
                            hasGreenArrow: true,
                            bbox: {minX, maxX, minY, maxY},
                            greenPixelCount: greenPixels.length,
                            topColorsNearArrow: topColors
                        });
                    } else {
                        // Just extract some general colors of the page
                        let colors = {};
                        // Sample every 10th pixel
                        for (let y = 0; y < canvas.height; y += 10) {
                            for (let x = 0; x < canvas.width; x += 10) {
                                const idx = (y * canvas.width + x) * 4;
                                const r = data[idx];
                                const g = data[idx+1];
                                const b = data[idx+2];
                                const key = `${r},${g},${b}`;
                                colors[key] = (colors[key] || 0) + 1;
                            }
                        }
                        const topColors = Object.entries(colors)
                            .sort((a,b) => b[1] - a[1])
                            .slice(0, 5)
                            .map(([rgbStr, count]) => {
                                const [r,g,b] = rgbStr.split(',').map(Number);
                                const hex = "#" + [r,g,b].map(x => x.toString(16).padStart(2, '0')).join('');
                                return {hex, rgb: `rgb(${r},${g},${b})`};
                            });

                        resolve({
                            filename,
                            hasGreenArrow: false,
                            topColorsPage: topColors
                        });
                    }
                };
                img.onerror = function() {
                    resolve({filename, error: 'Failed to load'});
                };
            });
        }

        async function run() {
            let out = [];
            for (let img of images) {
                const res = await analyzeImage(img);
                out.push(res);
            }
            resultsDiv.innerHTML = '<pre>' + JSON.stringify(out, null, 2) + '</pre>';
            console.log(out);
        }

        run();
    </script>
</body>
</html>
