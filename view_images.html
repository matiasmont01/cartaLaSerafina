<!DOCTYPE html>
<html>
<head>
    <title>View Images</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f0f0f0;
            margin: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 10px;
            text-align: center;
            max-width: 350px;
        }
        img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .name {
            font-weight: bold;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Cafeteria Menu Images</h1>
    <div class="container">
        <div class="card">
            <img src="assets/media__1786632762892.png" alt="Image 1">
            <div class="name">media__1786632762892.png</div>
        </div>
        <div class="card">
            <img src="assets/media__1786632762901.png" alt="Image 2">
            <div class="name">media__1786632762901.png</div>
        </div>
        <div class="card">
            <img src="assets/media__1786632762910.png" alt="Image 3">
            <div class="name">media__1786632762910.png</div>
        </div>
        <div class="card">
            <img src="assets/media__1786632762924.png" alt="Image 4">
            <div class="name">media__1786632762924.png</div>
        </div>
    </div>
</body>
</html>
